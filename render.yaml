services:
  - type: web
    name: gobi-replica
    env: node # Or 'runtime: docker' if deploying via Dockerfile
    plan: free
    region: oregon # Specify region (e.g., oregon, frankfurt, singapore)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: / # Ensures Render monitors your server health before routing traffic
    autoDeployTrigger: commit # Automatically deploys on git push
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      # Keep secrets out of code by prompting for them during deployment:
      # - key: API_KEY
      #   sync: false

      
